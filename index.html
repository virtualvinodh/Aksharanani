
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aksharajanani: Font Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Malar&family=Noto+Sans&family=Noto+Sans+Cyrillic&family=Noto+Sans+Devanagari&family=Noto+Sans+Greek&family=Noto+Sans+Malayalam&family=Noto+Sans+Sinhala&family=Noto+Sans+Tamil&family=Tiro+Telugu&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
    <script src="https://unpkg.com/opentype.js/dist/opentype.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/imagetracerjs@1.2.6/imagetracer_v1.2.6.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <script type="module">
      import UnicodeProperties from 'https://esm.sh/unicode-properties@1.4.1';
      window.UnicodeProperties = UnicodeProperties;
    </script>
    <style>
      .logo-emboss {
        /* Sharper shadow, stronger highlight for light mode */
        text-shadow: 1px 1px 2px rgba(0,0,0,0.25), -1px -1px 2px rgba(255,255,255,0.9);
      }
      .dark .logo-emboss {
        /* Stronger shadow, more visible highlight for dark mode */
        text-shadow: 1px 1px 2px rgba(0,0,0,0.7), -1px -1px 2px rgba(255,255,255,0.1);
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(1rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in-up {
        animation: fade-in-up 0.5s ease-out forwards;
      }
      .script-card-char {
        font-size: 3.5rem;
        line-height: 1;
        color: #4f46e5; /* Tailwind indigo-600 */
        margin-bottom: 0.5rem;
      }
      .dark .script-card-char {
        color: #818cf8; /* Tailwind indigo-400 */
      }
    </style>
  <script type="importmap">

  }
}
</script>
</head>
  <body class="bg-white text-gray-800 dark:bg-gray-900 dark:text-gray-200 transition-colors duration-300">

  </body>
</html>
